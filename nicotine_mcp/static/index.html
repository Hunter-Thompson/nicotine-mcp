<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicotine+ MCP</title>
<style>
  /* Tokens. One accent (amber) means "moving"; green, blue, red carry their usual meanings. */
  :root {
    --bg: #0f1114; --bg-1: #161a1f; --bg-2: #1d222a; --bg-3: #262c35;
    --line: rgba(255, 255, 255, .08); --line-2: rgba(255, 255, 255, .14);
    --fg: #e8ebef; --fg-1: #b4bcc8; --fg-2: #7f8894; --fg-3: #5a626d;
    --accent: #f5a524; --accent-fg: #1a1200; --accent-soft: rgba(245, 165, 36, .14);
    --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .14);
    --info: #60a5fa; --info-soft: rgba(96, 165, 250, .14);
    --bad: #f87171; --bad-soft: rgba(248, 113, 113, .14);
    --warn: #fbbf24;
    --shadow: 0 8px 30px rgba(0, 0, 0, .45);
    --radius: 10px; --radius-s: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f6; --bg-1: #ffffff; --bg-2: #f8f9fb; --bg-3: #eceef2;
      --line: rgba(15, 23, 42, .09); --line-2: rgba(15, 23, 42, .16);
      --fg: #111827; --fg-1: #374151; --fg-2: #6b7280; --fg-3: #9ca3af;
      --accent: #d97706; --accent-fg: #fff; --accent-soft: rgba(217, 119, 6, .12);
      --ok: #16a34a; --ok-soft: rgba(22, 163, 74, .12);
      --info: #2563eb; --info-soft: rgba(37, 99, 235, .12);
      --bad: #dc2626; --bad-soft: rgba(220, 38, 38, .12);
      --warn: #d97706;
      --shadow: 0 8px 30px rgba(15, 23, 42, .12);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f4f6; --bg-1: #ffffff; --bg-2: #f8f9fb; --bg-3: #eceef2;
    --line: rgba(15, 23, 42, .09); --line-2: rgba(15, 23, 42, .16);
    --fg: #111827; --fg-1: #374151; --fg-2: #6b7280; --fg-3: #9ca3af;
    --accent: #d97706; --accent-fg: #fff; --accent-soft: rgba(217, 119, 6, .12);
    --ok: #16a34a; --ok-soft: rgba(22, 163, 74, .12);
    --info: #2563eb; --info-soft: rgba(37, 99, 235, .12);
    --bad: #dc2626; --bad-soft: rgba(220, 38, 38, .12);
    --warn: #d97706;
    --shadow: 0 8px 30px rgba(15, 23, 42, .12);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
  button { font: inherit; color: inherit; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--fg-2); }
  .faint { color: var(--fg-3); }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .spacer { flex: 1; }
  [hidden] { display: none !important; }

  /* Top bar */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
         padding: 10px 20px; background: color-mix(in srgb, var(--bg-1) 88%, transparent); backdrop-filter: blur(10px);
         border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: 6px; }
  .brand h1 { font-size: 15px; letter-spacing: -.01em; }
  .brand .logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); color: var(--accent-fg);
                 display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px;
          background: var(--bg-2); border: 1px solid var(--line); color: var(--fg-1); max-width: 360px; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); flex: none; }
  .pill.on .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
  .pill.off .dot { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .pill.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .pill strong { font-weight: 600; color: var(--fg); }
  .nav { display: flex; gap: 2px; margin-left: 6px; }
  .nav a { color: var(--fg-2); text-decoration: none; font-size: 13px; padding: 5px 9px; border-radius: 6px; }
  .nav a:hover { color: var(--fg); background: var(--bg-2); }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); animation: pulse 2s infinite; }
  .live.held i { background: var(--fg-3); animation: none; }
  .live.bad i { background: var(--bad); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: var(--radius-s); font-size: 13px;
         font-weight: 500; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--fg-1); cursor: pointer;
         white-space: nowrap; transition: background .12s, border-color .12s, color .12s; line-height: 1.2; }
  .btn:hover { background: var(--bg-3); color: var(--fg); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-fg); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .btn.ok:hover { background: var(--ok-soft); }
  .btn.danger:hover { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: var(--bad-soft); }
  .btn.sm { padding: 3px 8px; font-size: 12px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--fg-2); }
  .btn.ghost:hover { background: var(--bg-2); color: var(--fg); }
  .btn.icon { padding: 5px 7px; }
  .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  /* Overflow menu, no JS library needed */
  .menu { position: relative; }
  .menu > summary { list-style: none; cursor: pointer; }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu > div { position: absolute; left: 0; top: calc(100% + 4px); z-index: 15; min-width: 220px; padding: 4px;
                background: var(--bg-1); border: 1px solid var(--line-2); border-radius: var(--radius-s); box-shadow: var(--shadow); }
  .menu > div button { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0; background: transparent;
                       border-radius: 4px; font-size: 13px; cursor: pointer; color: var(--fg-1); }
  .menu > div button:hover { background: var(--bg-3); color: var(--fg); }
  .menu > div button.danger { color: var(--bad); }
  .menu > div hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .menu > div small { display: block; color: var(--fg-3); font-size: 11px; }

  /* Page */
  main { max-width: 1480px; margin: 0 auto; padding: 18px 20px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 340px;
         gap: 22px; align-items: start; }
  .col { min-width: 0; display: grid; gap: 22px; }
  section { min-width: 0; }
  .sec-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .sec-head h2 { font-size: 15px; }
  .sec-head .count { font-size: 12px; color: var(--fg-2); background: var(--bg-2); border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; }
  .card { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius); }
  .empty { padding: 26px 18px; color: var(--fg-2); text-align: center; }
  .empty strong { display: block; color: var(--fg-1); margin-bottom: 4px; }

  /* Overview */
  .overview { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .stat { padding: 12px 14px; display: grid; gap: 4px; position: relative; overflow: hidden; }
  .stat .k { font-size: 12px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .stat .v { font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: -.02em; display: flex; align-items: baseline; gap: 6px; }
  .stat .v small { font-size: 13px; font-weight: 500; color: var(--fg-2); letter-spacing: 0; }
  .stat .s { font-size: 12.5px; color: var(--fg-2); }
  .stat.moving .v { color: var(--accent); }
  .stat.alert { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
  .stat.alert .v { color: var(--bad); }
  .stat.speed { padding-bottom: 30px; }
  .stat .spark { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34px; opacity: .8; pointer-events: none; }
  .stat .spark path { fill: none; stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .stat .spark path.area { fill: var(--accent-soft); stroke: none; }
  .stat .actions { margin-top: 2px; }

  /* Attention list */
  .alerts { grid-column: 1 / -1; display: grid; gap: 8px; }
  .alert { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: var(--radius-s);
           background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); font-size: 13px; }
  .alert.warn { background: var(--accent-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .alert.info { background: var(--info-soft); border-color: color-mix(in srgb, var(--info) 40%, transparent); }
  .alert .ic { font-size: 15px; flex: none; }

  /* Chips */
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chips button { border: 1px solid transparent; background: transparent; color: var(--fg-2); padding: 3px 9px; border-radius: 999px;
                  font-size: 12.5px; cursor: pointer; }
  .chips button:hover { color: var(--fg); background: var(--bg-2); }
  .chips button[aria-pressed="true"] { background: var(--bg-3); color: var(--fg); border-color: var(--line-2); }
  .chips b { font-weight: 500; color: var(--fg-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chips button[aria-pressed="true"] b { color: var(--fg-2); }

  /* Badges & status words */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
           background: var(--bg-3); color: var(--fg-1); white-space: nowrap; }
  .badge.accent { background: var(--accent-soft); color: var(--accent); }
  .badge.ok { background: var(--ok-soft); color: var(--ok); }
  .badge.info { background: var(--info-soft); color: var(--info); }
  .badge.bad { background: var(--bad-soft); color: var(--bad); }
  .badge.warn { background: var(--accent-soft); color: var(--warn); }
  .badge i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.accent i { animation: pulse 1.6s infinite; }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; color: var(--fg-2); border: 1px solid var(--line); }

  /* Progress */
  .bar { height: 8px; border-radius: 999px; background: var(--bg-3); overflow: hidden; display: flex; }
  .bar.thin { height: 5px; }
  .bar > i { display: block; height: 100%; }
  .bar .finished, .bar .owned-fill { background: var(--ok); }
  .bar .owned-fill { opacity: .55; }
  .bar .downloading { background: var(--accent); background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 6px, transparent 6px 12px);
                      animation: stripes 1.2s linear infinite; background-size: 17px 100%; }
  .bar .sourced { background: var(--info); }
  .bar .partial, .bar .not_found { background: repeating-linear-gradient(135deg, var(--fg-3) 0 3px, transparent 3px 7px); }
  .bar .failed, .bar .cancelled, .bar .not_on_label { background: var(--bad); opacity: .85; }
  .bar .cancelled, .bar .not_on_label { background: var(--fg-3); opacity: .5; }
  .bar .plain { background: var(--accent); }
  .bar .plain.done { background: var(--ok); }
  .bar .plain.paused { background: var(--fg-3); }
  @keyframes stripes { to { background-position: 17px 0; } }
  @media (prefers-reduced-motion: reduce) { .bar .downloading, .live i, .badge.accent i { animation: none; } }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--fg-2); margin-top: 8px; }
  .legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 1px 4px; border-radius: 4px; }
  .legend button:hover { background: var(--bg-2); color: var(--fg); }
  .legend button[aria-pressed="true"] { background: var(--bg-3); color: var(--fg); }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .legend b { font-weight: 600; color: var(--fg-1); }
  .swatch.finished { background: var(--ok); } .swatch.owned { background: var(--ok); opacity: .55; }
  .swatch.downloading { background: var(--accent); } .swatch.sourced { background: var(--info); }
  .swatch.pending { background: var(--bg-3); border: 1px solid var(--line-2); }
  .swatch.partial, .swatch.not_found { background: repeating-linear-gradient(135deg, var(--fg-3) 0 2px, transparent 2px 5px); }
  .swatch.failed { background: var(--bad); } .swatch.cancelled, .swatch.not_on_label { background: var(--fg-3); opacity: .6; }

  /* Jobs */
  .jobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
  .job { padding: 14px 16px 12px; display: grid; gap: 10px; transition: border-color .12s; }
  .job.open { grid-column: 1 / -1; }
  .job.blocked { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
  .job-head { display: flex; align-items: flex-start; gap: 10px; }
  .job-title { min-width: 0; flex: 1; }
  .job-title h3 { font-size: 16px; line-height: 1.25; }
  .job-title h3 button { all: unset; cursor: pointer; }
  .job-title h3 button:hover { color: var(--accent); }
  .job-title h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
  .job-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 12.5px; color: var(--fg-2); }
  .job-line { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
  .job-line .pct { font-weight: 600; font-variant-numeric: tabular-nums; }
  .job-activity { font-size: 12.5px; color: var(--fg-2); display: flex; gap: 6px; align-items: center; min-height: 18px; }
  .job-activity.moving { color: var(--accent); }
  .job-activity.blocked { color: var(--warn); }
  .job-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .job-details { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 12px; display: grid; gap: 10px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--fg-2); font-weight: 600;
       padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--bg-2); }
  tr.picked td { background: var(--accent-soft); }
  td.n, th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.name { max-width: 0; width: 40%; }
  td.name strong { display: block; font-weight: 500; }
  td.name small { display: block; color: var(--fg-2); font-size: 12px; }
  td .note { display: block; font-size: 12px; color: var(--fg-2); max-width: 360px; }
  .word { font-size: 12px; white-space: nowrap; color: var(--fg-2); }
  .word.downloading, .word.active { color: var(--accent); }
  .word.finished { color: var(--ok); }
  .word.failed { color: var(--bad); }
  .word.sourced, .word.queued { color: var(--info); }
  .word.owned { color: var(--ok); opacity: .8; }

  /* Transfers */
  .haul { border-top: 1px solid var(--line); }
  .haul:first-child { border-top: 0; }
  .haul-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px 120px 100px auto; gap: 12px; align-items: center; padding: 9px 14px;
              cursor: pointer; }
  .haul-row:hover { background: var(--bg-2); }
  .haul-row strong { display: block; font-weight: 500; font-size: 13.5px; }
  .haul-row small { display: block; color: var(--fg-2); font-size: 12px; margin-top: 1px; }
  .haul-row .bar { margin-top: 6px; }
  .haul-who { color: var(--fg-1); font-size: 13px; }
  .haul-rate { text-align: right; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .haul-rate.moving { color: var(--accent); font-weight: 600; }
  .haul-rate.bad { color: var(--bad); }
  .haul-rate small { display: block; color: var(--fg-2); font-size: 11.5px; font-weight: 400; }
  .haul-files { padding: 0 14px 10px 14px; }
  .haul-files table { font-size: 12.5px; }
  .haul-files td:first-child, .haul-files th:first-child { padding-left: 8px; }
  .chev { color: var(--fg-3); font-size: 11px; margin-right: 6px; transition: transform .12s; display: inline-block; }
  .haul-row[aria-expanded="true"] .chev { transform: rotate(90deg); }

  /* Rail */
  .rail-card { padding: 12px 14px; }
  .uploaders { display: grid; gap: 7px; }
  .uploaders div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 12.5px; align-items: center; }
  .uploaders .bar { grid-column: 1 / -1; height: 3px; }
  .uploaders .bar i { background: var(--info); }
  .queries { display: grid; gap: 2px; }
  .queries button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 6px 8px;
                    border-radius: var(--radius-s); cursor: pointer; font-size: 13px; }
  .queries button:hover, .queries button.picked { background: var(--bg-2); }
  .queries button:focus-visible { outline: 2px solid var(--accent); }
  .queries small { color: var(--fg-2); font-size: 11.5px; display: block; }
  .queries .n { color: var(--fg-2); font-size: 12px; }
  pre.log { margin: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s);
            font: 11.5px/1.55 var(--mono); color: var(--fg-1); max-height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  pre.log .lg-dl { color: var(--fg); }
  pre.log .lg-bad { color: var(--bad); }
  .rail-foot { font-size: 11.5px; color: var(--fg-3); display: grid; gap: 2px; }

  /* Drawer */
  .drawer { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(900px, 100vw); background: var(--bg-1);
            border-left: 1px solid var(--line-2); box-shadow: var(--shadow); overflow: auto; padding: 16px 20px 32px; }
  .drawer-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .drawer-head h2 { font-size: 17px; }
  .scrim { position: fixed; inset: 0; z-index: 29; background: rgba(0, 0, 0, .35); }

  /* Toasts */
  .toasts { position: fixed; z-index: 40; right: 16px; bottom: 16px; display: grid; gap: 8px; max-width: 380px; }
  .toast { padding: 10px 14px; border-radius: var(--radius-s); background: var(--bg-1); border: 1px solid var(--line-2); box-shadow: var(--shadow);
           font-size: 13px; animation: rise .18s ease-out; }
  .toast.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); color: var(--bad); }
  .toast.ok { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } }

  @media (max-width: 1100px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    main { padding: 12px 12px 40px; gap: 16px; }
    .top { padding: 8px 12px; gap: 8px; }
    .top .spacer { display: none; }
    .nav, .top .pill .path { display: none; }
    .overview { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .stat .v { font-size: 22px; }
    .jobs { grid-template-columns: minmax(0, 1fr); }
    .haul-row { grid-template-columns: minmax(0, 1fr) auto; }
    .haul-who, .haul-count { display: none; }
    .haul-row .actions { grid-column: 1 / -1; }
    .hide-sm { display: none; }
    td.name { width: auto; max-width: 200px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">N</span><h1>Nicotine+ MCP</h1></div>
  <span class="pill" id="conn"><span class="dot"></span><span>connecting…</span></span>
  <span class="pill" id="disk" hidden><span class="dot"></span><span></span></span>
  <nav class="nav" aria-label="Sections"><a href="#transfers">Transfers</a><a href="#jobs">Crates</a><a href="#searches">Searches</a><a href="#log">Log</a></nav>
  <span class="spacer"></span>
  <div class="actions" id="global-actions"></div>
  <button class="btn ghost icon" id="theme" type="button" title="Switch between light and dark" aria-label="Switch theme">◐</button>
  <button class="btn ghost sm" id="hold" type="button" title="Stop refreshing the page, e.g. while reading the log">Hold</button>
  <span class="live" id="live"><i></i><span>live</span></span>
</header>

<main>
  <div class="overview" id="overview"></div>
  <div class="alerts" id="alerts" hidden></div>

  <div class="col">
    <section id="transfers">
      <div class="sec-head">
        <h2>Transfers</h2><span class="count" id="transfers-count">0</span>
        <div class="chips" id="filters" role="group" aria-label="Filter transfers"></div>
        <span class="spacer"></span>
        <div class="actions" id="transfer-actions"></div>
      </div>
      <div class="card" id="hauls"></div>
    </section>

    <section id="jobs">
      <div class="sec-head">
        <h2>Crates</h2><span class="count" id="jobs-count">0</span>
        <span class="muted" style="font-size:12.5px">label and artist jobs run by the agent</span>
        <span class="spacer"></span>
        <button class="btn sm" type="button" data-do="export" title="Save jobs and downloads to the drive, for another user or Mac">Export</button>
      </div>
      <div class="jobs" id="crates"></div>
    </section>
  </div>

  <aside class="col">
    <section id="searches">
      <div class="sec-head"><h2>Searches</h2><span class="count" id="searches-count">0</span></div>
      <div class="card rail-card queries" id="queries"></div>
    </section>
    <section id="uploaders">
      <div class="sec-head"><h2>Fastest uploaders</h2><span class="muted" style="font-size:12px" id="measured"></span></div>
      <div class="card rail-card" id="board"></div>
    </section>
    <section id="log">
      <div class="sec-head"><h2>Log</h2><span class="spacer"></span><button class="btn ghost sm" type="button" data-do="copy-log">Copy</button></div>
      <pre class="log" id="logbox" tabindex="0"></pre>
      <div class="rail-foot" id="foot" style="margin-top:8px"></div>
    </section>
  </aside>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Search results"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  // Everything shared by peers is untrusted: it all goes through this on its way to the page
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => (
    {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  const FILTERS = ["all", "active", "queued", "paused", "failed", "finished"];
  const STATE_ORDER = ["finished", "owned", "downloading", "sourced", "pending", "partial", "not_found", "failed", "not_on_label", "cancelled"];
  const WORDS = {
    pending: "to search", sourced: "available", downloading: "downloading", finished: "collected", owned: "already owned",
    partial: "incomplete copies only", not_found: "not found", failed: "failed", not_on_label: "not on this label", cancelled: "cancelled"
  };
  const HISTORY = 90;
  const view = {
    filter: "all", held: false, data: null, history: [], openJob: null, jobFilter: "all", jobData: null, pickedTitle: null,
    openHauls: new Set(), search: null, group: "album", skew: 0
  };

  // Theme: follows the system unless chosen here (or ?theme= for screenshots)
  const themeParam = new URLSearchParams(location.search).get("theme");
  let theme = themeParam || (() => { try { return localStorage.getItem("theme") || "auto"; } catch (e) { return "auto"; } })();
  const applyTheme = () => { document.documentElement.dataset.theme = theme; };
  applyTheme();
  $("theme").addEventListener("click", () => {
    const isDark = theme === "dark" || (theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    theme = isDark ? "light" : "dark";
    try { localStorage.setItem("theme", theme); } catch (e) { /* private mode */ }
    applyTheme();
  });

  // Rewriting the same HTML would lose hover and focus every two seconds
  const painted = new Map();
  function paint(element, html) {
    if (painted.get(element) === html) return false;
    painted.set(element, html);
    element.innerHTML = html;
    return true;
  }

  // Binary units, like Nicotine+ itself
  function splitRate(bytes) {
    if (bytes >= 1048576) return [(bytes / 1048576).toFixed(bytes >= 10485760 ? 0 : 1), "MiB/s"];
    return [String(Math.round(bytes / 1024)), "KiB/s"];
  }
  const showRate = (bytes) => splitRate(bytes).join(" ");
  function showSize(bytes) {
    if (bytes >= 1099511627776) return `${(bytes / 1099511627776).toFixed(2)} TiB`;
    if (bytes >= 1073741824) return `${(bytes / 1073741824).toFixed(1)} GiB`;
    if (bytes >= 1048576) return `${Math.round(bytes / 1048576)} MiB`;
    return `${Math.round(bytes / 1024)} KiB`;
  }
  function showTime(seconds) {
    seconds = Math.max(0, Math.round(seconds));
    if (seconds < 60) return `${seconds}s`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
    return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
  }
  function ago(timestamp) {
    const seconds = Math.max(0, Date.now() / 1000 - view.skew - timestamp);
    if (seconds < 60) return "just now";
    if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
    if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
    return `${Math.floor(seconds / 86400)} d ago`;
  }
  function until(timestamp) {
    const seconds = timestamp - (Date.now() / 1000 - view.skew);
    if (seconds < 60) return "shortly";
    if (seconds < 3600) return `in ${Math.round(seconds / 60)} min`;
    return `in ${(seconds / 3600).toFixed(seconds < 7200 ? 1 : 0)} h`;
  }
  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  async function api(path, body) {
    const options = body === undefined ? {} : {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Requested-With": "nicotine-mcp"},
      body: JSON.stringify(body)
    };
    const response = await fetch(path, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || response.statusText);
    return data;
  }

  function toast(message, kind = "") {
    const box = document.createElement("div");
    box.className = `toast ${kind}`;
    box.textContent = message;
    $("toasts").appendChild(box);
    setTimeout(() => box.remove(), kind === "bad" ? 7000 : 3500);
  }

  // Top bar & overview //

  function renderTop(data) {
    const status = data.status;
    const conn = $("conn");
    conn.className = `pill ${status.connected ? "on" : "off"}`;
    const who = status.connected ? `<strong>${esc(status.username)}</strong> <span class="muted">${esc(status.status)}</span>`
      : status.needs_credentials ? `<strong>Offline</strong> <span class="muted">no account configured</span>`
      : `<strong>Offline</strong> <span class="muted">reconnecting…</span>`;
    paint(conn, `<span class="dot"></span><span class="ellipsis">${who}</span>`);

    const disk = data.disk;
    const diskPill = $("disk");
    if (disk) {
      diskPill.hidden = false;
      const low = disk.free_bytes < 10e9;
      diskPill.className = `pill ${disk.is_available ? (low ? "warn" : "") : "off"}`;
      const text = disk.is_available ? `${showSize(disk.free_bytes)} free` : "download drive missing";
      paint(diskPill, `<span class="dot" style="background:${disk.is_available ? (low ? "var(--warn)" : "var(--info)") : "var(--bad)"}"></span>` +
        `<span class="ellipsis" title="${esc(disk.path)}">${esc(text)} <span class="path muted">· ${esc(disk.path)}</span></span>`);
    } else {
      diskPill.hidden = true;
    }

    const jobs = data.jobs || [];
    const anyRunning = jobs.some((job) => job.status === "running" || job.status === "waiting_retry");
    const counts = status.downloads;
    const pausedByAll = jobs.some((job) => job.paused_by_all);
    const canPause = counts.active || counts.queued || anyRunning;
    const canResume = counts.paused || pausedByAll;
    paint($("global-actions"),
      (canPause ? `<button class="btn sm" type="button" data-do="pause-all" title="Pause every transfer and every running job. Partial files are kept.">⏸ Pause all</button>` : "") +
      (canResume ? `<button class="btn sm ok" type="button" data-do="resume-all" title="Continue everything that Pause all stopped">▶ Resume all</button>` : ""));
  }

  function sparkline(history) {
    if (!history.some(Boolean)) return "";
    const peak = Math.max(...history, 1);
    const step = 200 / (HISTORY - 1);
    const offset = (HISTORY - history.length) * step;
    const points = history.map((item, index) => `${(offset + index * step).toFixed(1)} ${(53 - item / peak * 48).toFixed(1)}`);
    if (points.length < 2) return "";
    const line = `M${points.join("L")}`;
    return `<svg class="spark" viewBox="0 0 200 54" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${line}L200 54L${offset.toFixed(1)} 54Z"></path><path d="${line}"></path></svg>`;
  }

  function renderOverview(data) {
    const status = data.status;
    const counts = status.downloads;
    const speed = data.download_speed_bytes || 0;
    view.history.push(speed);
    if (view.history.length > HISTORY) view.history.shift();
    const [value, unit] = splitRate(speed);

    const jobs = data.jobs || [];
    const running = jobs.filter((job) => job.status === "running" || job.status === "waiting_retry").length;
    const paused = jobs.filter((job) => job.status === "paused").length;
    const blocked = jobs.filter((job) => job.blocked_reason && job.status !== "paused" && job.status !== "cancelled").length;
    const collected = jobs.reduce((sum, job) => sum + (job.counts.finished || 0), 0);
    const downloadingReleases = jobs.reduce((sum, job) => sum + (job.counts.downloading || 0), 0);
    const toSearch = jobs.reduce((sum, job) => sum + (job.counts.pending || 0), 0);
    const problems = counts.failed + blocked;

    const etaBytes = data.downloads.filter((d) => d.state === "active" || d.state === "queued")
      .reduce((sum, d) => sum + Math.max(0, d.size_bytes - d.bytes_transferred), 0);
    const eta = speed > 0 && etaBytes > 0 ? `≈ ${showTime(etaBytes / speed)} left for ${showSize(etaBytes)}` : (etaBytes ? `${showSize(etaBytes)} to go` : "nothing queued");

    paint($("overview"), `
      <div class="card stat speed ${speed ? "moving" : ""}">
        <div class="k">Download speed</div>
        <div class="v num">${value}<small>${unit}</small></div>
        <div class="s">${esc(eta)}</div>
        ${sparkline(view.history)}
      </div>
      <div class="card stat">
        <div class="k">Transfers</div>
        <div class="v num">${counts.active}<small>active</small></div>
        <div class="s">${plural(counts.queued, "file")} queued · ${counts.paused ? `${counts.paused} paused · ` : ""}${counts.finished} done</div>
      </div>
      <div class="card stat">
        <div class="k">Crates</div>
        <div class="v num">${running}<small>${running === 1 ? "job" : "jobs"} running</small></div>
        <div class="s">${paused ? `${paused} paused · ` : ""}${downloadingReleases ? `${plural(downloadingReleases, "release")} downloading · ` : ""}${collected} collected · ${toSearch} to search</div>
      </div>
      <div class="card stat ${problems ? "alert" : ""}">
        <div class="k">Needs attention</div>
        <div class="v num">${problems}<small>${problems === 1 ? "issue" : "issues"}</small></div>
        <div class="s">${problems ? [counts.failed ? plural(counts.failed, "failed transfer") : "", blocked ? plural(blocked, "blocked job") : ""].filter(Boolean).join(" · ") : "all clear"}</div>
        ${counts.failed ? `<div class="actions"><button class="btn sm" type="button" data-do="retry-failed">Retry all failed</button></div>` : ""}
      </div>`);

    const alerts = [];
    if (!status.connected) {
      alerts.push(status.needs_credentials
        ? `<div class="alert"><span class="ic">⚠</span><div>No Soulseek account is configured. Set NICOTINE_USERNAME and NICOTINE_PASSWORD, or log in once with Nicotine+.</div></div>`
        : `<div class="alert"><span class="ic">⚠</span><div>Not connected to Soulseek. Transfers and jobs continue once the login succeeds; the log below says why it fails.</div></div>`);
    }
    if (data.disk && !data.disk.is_available) {
      alerts.push(`<div class="alert"><span class="ic">⚠</span><div>The download folder <span class="mono">${esc(data.disk.path)}</span> is not reachable. Jobs wait instead of writing to the system disk. Is the drive connected?</div></div>`);
    } else if (data.disk && data.disk.free_bytes < 10e9) {
      alerts.push(`<div class="alert warn"><span class="ic">⚠</span><div>Only ${showSize(data.disk.free_bytes)} left on the download drive.</div></div>`);
    }
    if (jobs.some((job) => job.paused_by_all)) {
      alerts.push(`<div class="alert info"><span class="ic">⏸</span><div>Everything is paused.</div><span class="spacer"></span><button class="btn sm ok" type="button" data-do="resume-all">Resume all</button></div>`);
    }
    for (const job of jobs) {
      if (job.blocked_reason && job.status !== "paused" && job.status !== "cancelled" && status.connected && !(data.disk && !data.disk.is_available)) {
        alerts.push(`<div class="alert warn"><span class="ic">⚠</span><div><strong>${esc(job.name)}</strong> is blocked: ${esc(job.blocked_reason)}</div></div>`);
      }
    }
    $("alerts").hidden = !alerts.length;
    paint($("alerts"), alerts.join(""));
  }

  // Crates (jobs) //

  function jobProgress(job) {
    const total = job.num_releases || 1;
    const segments = STATE_ORDER.filter((state) => job.counts[state]).map((state) => {
      const cls = state === "owned" ? "owned-fill" : state;
      return `<i class="${cls}" style="width:${(job.counts[state] / total * 100).toFixed(2)}%" title="${job.counts[state]} ${esc(WORDS[state])}"></i>`;
    }).join("");
    return `<div class="bar" role="img" aria-label="Progress by release">${segments}</div>`;
  }

  function jobBadge(job) {
    const c = job.counts;
    if (job.status === "cancelled") return `<span class="badge">Cancelled</span>`;
    if (job.status === "finished") return `<span class="badge ok">Finished</span>`;
    if (job.status === "previewed") return `<span class="badge info">Preview ready</span>`;
    if (job.status === "paused") return job.paused_by_all ? `<span class="badge">Paused (all)</span>` : `<span class="badge">Paused</span>`;
    if (job.status === "waiting_retry") return `<span class="badge info">Waiting to retry</span>`;
    if (job.blocked_reason) return `<span class="badge warn"><i></i>Waiting</span>`;
    if (job.mode === "preview") return `<span class="badge accent"><i></i>Previewing</span>`;
    return `<span class="badge accent"><i></i>${c.downloading ? "Downloading" : "Searching"}</span>`;
  }

  function jobActivity(job, shelf) {
    const c = job.counts;
    if (job.status === "paused") {
      if (c.downloading && job.pause_mode !== "now") return ["", `${plural(c.downloading, "album")} finishing, then nothing new starts`];
      return ["", `paused${job.pause_mode === "now" ? " where it was" : ""}${c.pending ? ` · ${c.pending} still to search` : ""}`];
    }
    if (job.status === "cancelled") return ["", `cancelled ${ago(job.finished_at || job.created_at)}`];
    if (job.status === "finished") return ["", `finished ${ago(job.finished_at || job.created_at)}`];
    if (job.status === "previewed") return ["", `${job.num_available} available${job.num_available_flac ? `, ${job.num_available_flac} as FLAC` : ""} · nothing downloaded yet`];
    if (job.status === "waiting_retry") return ["", `searching again ${job.next_retry_at ? until(job.next_retry_at) : "later"} for ${plural((c.not_found || 0) + (c.partial || 0), "missing release")}`];
    if (job.blocked_reason) return ["blocked", job.blocked_reason];
    const moving = (shelf || []).filter((item) => item.state === "downloading" && !item.is_queued);
    if (moving.length) {
      const item = moving.sort((a, b) => b.progress_percent - a.progress_percent)[0];
      const more = moving.length > 1 ? ` +${moving.length - 1} more` : "";
      return ["moving", `↓ ${item.title} · ${Math.round(item.progress_percent)}%${item.uploader ? ` from ${item.uploader}` : ""}${more}`];
    }
    if (c.downloading) return ["", `${plural(c.downloading, "album")} waiting in uploader queues`];
    if (job.mode === "preview") return ["moving", `looking around · ${c.pending || 0} left to search`];
    return ["moving", c.pending ? `searching · ${c.pending} left` : "collecting"];
  }

  function jobActions(job) {
    const c = job.counts;
    const id = esc(job.job_id);
    const act = (name, label, cls = "btn sm", extra = "") => `<button class="${cls}" type="button" data-job-do="${name}" data-job="${id}" ${extra}>${label}</button>`;
    const primary = [];
    const more = [];
    const isActive = job.status === "running" || job.status === "waiting_retry";
    if (job.mode === "preview" && job.status !== "cancelled" && job.num_available) {
      primary.push(act("start-downloads", `Download ${job.num_available}`, "btn sm primary"));
      if ((job.formats || []).join() !== "flac") {
        more.push(`<button type="button" data-job-do="start-downloads" data-flac="1" data-job="${id}">Download, FLAC only<small>${job.num_available_flac} have a FLAC copy, the rest are searched for again</small></button>`);
      }
    }
    if (isActive) {
      primary.push(act("pause", "Pause", "btn sm", `title="Albums that have started finish, nothing new starts"`));
      if (c.downloading) more.push(`<button type="button" data-job-do="pause" data-now="1" data-job="${id}">Pause now<small>Stops transfers right away, they continue on resuming</small></button>`);
    }
    if (job.status === "paused") {
      primary.push(act("resume", "Resume", "btn sm primary"));
      if (c.downloading && job.pause_mode !== "now") more.push(`<button type="button" data-job-do="pause" data-now="1" data-job="${id}">Stop transfers now</button>`);
    }
    if (c.not_found || c.partial) more.push(`<button type="button" data-job-do="retry-missing" data-job="${id}">Search again for ${plural((c.not_found || 0) + (c.partial || 0), "missing release")}</button>`);
    more.push(`<hr>`);
    if (isActive || job.status === "paused") more.push(`<button type="button" class="danger" data-job-do="cancel" data-job="${id}">Cancel job<small>Unfinished downloads are removed, finished files stay</small></button>`);
    else more.push(`<button type="button" class="danger" data-job-do="remove" data-job="${id}">Remove from list<small>Files stay on disk</small></button>`);
    const menu = `<details class="menu"><summary class="btn sm icon" aria-label="More actions" title="More">⋯</summary><div>${more.join("")}</div></details>`;
    return primary.join("") + menu;
  }

  function renderCrates(jobs) {
    $("jobs-count").textContent = jobs.length;
    if (!jobs.length) {
      paint($("crates"), `<div class="card empty" style="grid-column:1/-1"><strong>No crates yet</strong>Ask your agent to collect a label, an artist's discography or the albums of a playlist. It shows up here with every release and its progress.</div>`);
      return;
    }
    const before = painted.get($("crates"));
    paint($("crates"), jobs.map((job) => {
      const [actClass, actText] = jobActivity(job, job.shelf);
      const total = job.num_releases || 0;
      const done = (job.counts.finished || 0) + (job.counts.owned || 0);
      const pct = total ? Math.round(done / total * 100) : 0;
      const isOpen = view.openJob === job.job_id;
      const legend = STATE_ORDER.filter((state) => job.counts[state]).map((state) => (
        `<button type="button" data-job-filter="${state}" data-job="${esc(job.job_id)}" aria-pressed="${isOpen && view.jobFilter === state}"><i class="swatch ${state}"></i><b>${job.counts[state]}</b> ${esc(WORDS[state])}</button>`
      )).join("");
      return `<article class="card job ${isOpen ? "open" : ""} ${job.blocked_reason && job.status === "running" ? "blocked" : ""}" id="job-${esc(job.job_id)}">
        <div class="job-head">
          <div class="job-title">
            <h3><button type="button" data-job-open="${esc(job.job_id)}" aria-expanded="${isOpen}">${esc(job.name)}</button></h3>
            <div class="job-meta">
              <span>${job.artist_id ? "artist" : job.label_id ? "label" : "list"}</span><span>·</span>
              <span>${job.num_releases < job.num_in_catalog ? `${job.num_releases} of ${job.num_in_catalog} releases` : plural(job.num_releases, "release")}</span>
              ${(job.formats || []).join() === "flac" ? `<span class="tag">FLAC only</span>` : ""}
              ${job.mode === "preview" ? `<span class="tag">preview</span>` : ""}
              <span class="faint">· started ${ago(job.created_at)}</span>
            </div>
          </div>
          ${jobBadge(job)}
        </div>
        ${jobProgress(job)}
        <div class="job-line"><span class="pct">${pct}%</span><span class="muted">${done} of ${total} collected</span></div>
        <div class="job-activity ${actClass}"><span class="ellipsis" title="${esc(actText)}">${esc(actText)}</span></div>
        <div class="legend">${legend}</div>
        <div class="job-foot"><div class="actions">${jobActions(job)}</div><span class="spacer"></span>
          <button class="btn ghost sm" type="button" data-job-open="${esc(job.job_id)}">${isOpen ? "Hide releases" : "Show releases"}</button></div>
        <div class="job-details" data-sheet="${esc(job.job_id)}" ${isOpen ? "" : "hidden"}></div>
      </article>`;
    }).join(""));
    if (before !== painted.get($("crates"))) renderOpenCrate();
  }

  function releaseActions(job, item) {
    if (job.status === "cancelled" || item.state === "finished" || item.state === "owned") return "";
    const act = (name, label, title) => `<button class="btn sm ghost" type="button" data-job-do="${name}" data-job="${esc(job.job_id)}" data-release="${esc(item.release_id)}" title="${title}">${label}</button>`;
    const buttons = [];
    if (item.state !== "downloading") buttons.push(act("prioritize-release", item.state === "pending" || item.state === "sourced" ? "Next" : "Try again", "Work on this one next"));
    if (item.state !== "cancelled" && item.state !== "not_on_label") buttons.push(act("skip-release", "Skip", "Leave this one out"));
    return buttons.join("");
  }

  function renderOpenCrate() {
    document.querySelectorAll("[data-sheet]").forEach((box) => {
      if (box.dataset.sheet !== view.openJob) { box.hidden = true; box.innerHTML = ""; delete box.dataset.painted; return; }
      box.hidden = false;
      if (!view.jobData) { if (!box.innerHTML) box.innerHTML = `<div class="muted">Loading releases…</div>`; return; }
      const job = view.jobData;
      const names = ["all", ...STATE_ORDER.filter((state) => job.counts[state])];
      const tabs = names.map((name) => {
        const count = name === "all" ? job.num_releases : job.counts[name];
        return `<button type="button" data-job-filter="${name}" data-job="${esc(job.job_id)}" aria-pressed="${name === view.jobFilter}">${esc(name === "all" ? "all" : WORDS[name])}<b>${count}</b></button>`;
      }).join("");
      const rows = job.releases.filter((item) => view.jobFilter === "all" || item.state === view.jobFilter);
      const body = rows.map((item) => {
        let detail = item.note || "";
        if (item.state === "downloading" && !item.is_queued) detail = `${item.num_files_finished}/${item.num_files} files · ${Math.round(item.progress_percent)}%${item.speed_bytes ? ` · ${showRate(item.speed_bytes)}` : ""}`;
        else if (item.state === "downloading" && item.is_queued) detail = "waiting in the uploader's queue";
        else if (item.state === "partial" && item.best_partial_copy) detail = `best copy has ${item.best_partial_copy.num_matched} of ${item.best_partial_copy.num_expected} tracks`;
        else if (item.local_path) detail = item.local_path;
        const progress = item.state === "downloading" && !item.is_queued ? `<div class="bar thin" style="margin-top:4px;max-width:220px"><i class="plain" style="width:${item.progress_percent}%"></i></div>` : "";
        return `<tr class="${view.pickedTitle === item.title ? "picked" : ""}">
          <td class="mono hide-sm muted">${esc((item.catalog_numbers || [])[0] || "")}</td>
          <td class="name"><strong class="ellipsis" title="${esc(item.title)}">${esc(item.title)}</strong><small class="ellipsis">${esc(item.artist)}${item.year ? ` · ${item.year}` : ""}${item.kind ? ` · ${esc(item.kind)}` : ""}${item.track_count ? ` · ${plural(item.track_count, "track")}` : ""}</small></td>
          <td><span class="word ${esc(item.state)}">${esc(WORDS[item.state])}</span>${item.uploader ? ` <span class="muted" style="font-size:12px">· ${esc(item.uploader)}</span>` : ""}<span class="note ellipsis" title="${esc(detail)}">${esc(detail)}</span>${progress}</td>
          <td class="n">${releaseActions(job, item)}</td>
        </tr>`;
      }).join("");
      const html = `<div class="chips" role="group" aria-label="Filter releases">${tabs}</div>
        <table><thead><tr><th class="hide-sm">Cat. no.</th><th>Release</th><th>Status</th><th></th></tr></thead>
        <tbody>${body || `<tr><td colspan="4" class="muted">Nothing here.</td></tr>`}</tbody></table>`;
      if (box.dataset.painted !== html) { box.innerHTML = html; box.dataset.painted = html; }
    });
  }

  async function loadOpenCrate() {
    if (view.openJob === null) return;
    try {
      view.jobData = await api(`/api/jobs/${encodeURIComponent(view.openJob)}?limit=2000`);
      renderOpenCrate();
    } catch (error) {
      view.openJob = null;
      view.jobData = null;
      renderOpenCrate();
    }
  }

  // Transfers, grouped by album folder //

  function folderOf(download) {
    return download.virtual_path.slice(0, download.virtual_path.length - download.basename.length - 1);
  }

  function buildHauls(downloads) {
    const hauls = new Map();
    for (const download of downloads) {
      const folder = folderOf(download);
      const key = `${download.username}\n${folder}`;
      if (!hauls.has(key)) {
        hauls.set(key, {key, username: download.username, folder, name: folder.split("\\").pop() || folder, files: [], bytes: 0, size: 0, speed: 0, counts: {}, position: 0, left: 0});
      }
      const haul = hauls.get(key);
      haul.files.push(download);
      haul.bytes += download.state === "finished" ? download.size_bytes : download.bytes_transferred;
      haul.size += download.size_bytes;
      haul.speed += download.state === "active" ? download.speed_bytes : 0;
      haul.counts[download.state] = (haul.counts[download.state] || 0) + 1;
      if (download.state === "queued" && download.queue_position) haul.position = Math.max(haul.position, download.queue_position);
      if (download.state === "active" && download.time_left_seconds) haul.left = Math.max(haul.left, download.time_left_seconds);
    }
    const order = (haul) => (haul.counts.active ? 0 : haul.counts.queued ? 1 : haul.counts.paused ? 2 : haul.counts.failed ? 3 : 4);
    return [...hauls.values()].sort((a, b) => order(a) - order(b) || b.speed - a.speed);
  }

  function haulRate(haul) {
    if (haul.speed) return ["moving", `${showRate(haul.speed)}<small>${haul.left ? `${showTime(haul.left)} left` : ""}</small>`];
    const isDone = (haul.counts.finished || 0) === haul.files.length;
    if (isDone) return ["", `<span class="word finished">done</span>`];
    if (haul.counts.failed && !haul.counts.queued && !haul.counts.active) return ["bad", `failed<small>${haul.files.some((f) => f.will_retry) ? "retries soon" : ""}</small>`];
    if (haul.counts.active) return ["moving", "starting…"];
    if (haul.position) return ["", `queued<small>#${haul.position} in line</small>`];
    if (haul.counts.queued) return ["", "queued<small>asking uploader</small>"];
    if (haul.counts.paused) return ["", "paused"];
    return ["", ""];
  }

  function renderHauls(downloads) {
    const counts = {all: downloads.length};
    for (const download of downloads) counts[download.state] = (counts[download.state] || 0) + 1;
    $("transfers-count").textContent = downloads.length;
    paint($("filters"), FILTERS.filter((name) => name === "all" || counts[name]).map((name) => (
      `<button type="button" data-filter="${name}" aria-pressed="${name === view.filter}">${name}<b>${counts[name] || 0}</b></button>`
    )).join(""));
    paint($("transfer-actions"),
      (counts.failed ? `<button class="btn sm" type="button" data-do="retry-failed">Retry failed</button>` : "") +
      (counts.finished ? `<button class="btn sm ghost" type="button" data-do="clear-finished">Clear finished</button>` : ""));

    const shown = downloads.filter((download) => view.filter === "all" || download.state === view.filter);
    if (!shown.length) {
      paint($("hauls"), `<div class="empty"><strong>${view.filter === "all" ? "Nothing on the way" : `No ${esc(view.filter)} transfers`}</strong>${view.filter === "all" ? "Ask your agent for a track, an album, a label or an artist." : ""}</div>`);
      return;
    }
    paint($("hauls"), buildHauls(shown).map((haul) => {
      const numFinished = haul.counts.finished || 0;
      const isDone = numFinished === haul.files.length;
      const percent = haul.size ? Math.min(100, haul.bytes / haul.size * 100) : (isDone ? 100 : 0);
      const isOpen = view.openHauls.has(haul.key);
      const [rateClass, rate] = haulRate(haul);
      const barClass = isDone ? "plain done" : haul.counts.paused && !haul.counts.active && !haul.counts.queued ? "plain paused" : "plain";
      const buttons = [];
      if (haul.counts.active || haul.counts.queued) buttons.push(haulButton("pause", "Pause", haul));
      if (haul.counts.paused || haul.counts.failed) buttons.push(haulButton("retry", "Retry", haul));
      buttons.push(haulButton("remove", "Remove", haul, "danger"));
      const files = !isOpen ? "" : `<div class="haul-files"><table><thead><tr><th>File</th><th>Status</th><th class="n">Size</th><th class="n">Progress</th><th class="n">Rate</th><th></th></tr></thead><tbody>` +
        haul.files.map((file) => {
          const left = file.state === "active" && file.time_left_seconds ? showTime(file.time_left_seconds) : (file.queue_position ? `#${file.queue_position}` : "");
          const actions = [];
          if (file.state === "active" || file.state === "queued") actions.push(fileButton("pause", "Pause", file));
          if (file.state === "paused" || file.state === "failed") actions.push(fileButton("retry", "Retry", file));
          actions.push(fileButton("remove", "Remove", file, "danger"));
          return `<tr><td class="name"><span class="ellipsis" style="display:block" title="${esc(file.local_path || file.basename)}">${esc(file.basename)}</span></td>
            <td><span class="word ${esc(file.state)}">${esc(file.status)}${file.will_retry ? " · will retry" : ""}</span></td>
            <td class="n">${esc(file.size)}</td><td class="n">${file.progress_percent.toFixed(0)}%</td>
            <td class="n">${file.state === "active" ? esc(file.speed || left) : esc(left)}</td><td class="n"><div class="actions" style="justify-content:flex-end">${actions.join("")}</div></td></tr>`;
        }).join("") + "</tbody></table></div>";
      return `<div class="haul">
        <div class="haul-row" data-haul-open="${esc(haul.key)}" aria-expanded="${isOpen}">
          <div style="min-width:0"><strong class="ellipsis" title="${esc(haul.folder)}"><span class="chev">▶</span>${esc(haul.name)}</strong>
            <small>${numFinished}/${haul.files.length} files · ${showSize(haul.bytes)} of ${showSize(haul.size)}</small>
            <div class="bar thin"><i class="${barClass}" style="width:${percent.toFixed(1)}%"></i></div></div>
          <div class="haul-who ellipsis" title="from ${esc(haul.username)}">${esc(haul.username)}</div>
          <div class="haul-count num muted" style="font-size:12.5px">${percent.toFixed(0)}%</div>
          <div class="haul-rate ${rateClass}">${rate}</div>
          <div class="actions" style="justify-content:flex-end">${buttons.join("")}</div>
        </div>${files}
      </div>`;
    }).join(""));
  }

  function haulButton(name, label, haul, kind = "") {
    return `<button class="btn sm ghost ${kind}" type="button" data-haul-do="${name}" data-haul="${esc(haul.key)}">${label}</button>`;
  }
  function fileButton(name, label, file, kind = "") {
    return `<button class="btn sm ghost ${kind}" type="button" data-file-do="${name}" data-user="${esc(file.username)}" data-path="${esc(file.virtual_path)}">${label}</button>`;
  }

  // Rail //

  function renderBoard(data) {
    const fastest = data.fastest_uploaders || [];
    $("measured").textContent = data.num_uploaders_measured ? `${data.num_uploaders_measured} measured` : "";
    if (!fastest.length) {
      paint($("board"), `<div class="muted" style="font-size:12.5px">No measurements yet. Real speeds appear once something has transferred.</div>`);
      return;
    }
    const low = 50e3;
    const high = Math.max(fastest[0].speed_bytes, 5e6);
    const reach = (speed) => Math.max(2, Math.log(Math.max(speed, low) / low) / Math.log(high / low) * 100);
    paint($("board"), `<div class="uploaders">` + fastest.map((item) => (
      `<div><span class="ellipsis" title="${esc(item.username)}">${esc(item.username)}</span><span class="num muted">${esc(showRate(item.speed_bytes))}</span><div class="bar"><i style="width:${reach(item.speed_bytes).toFixed(0)}%"></i></div></div>`
    )).join("") + `</div><div class="muted" style="font-size:11.5px;margin-top:10px">Measured on real transfers. What uploaders claim is not used.</div>`);
  }

  function renderQueries(searches) {
    $("searches-count").textContent = searches.length;
    if (!searches.length) {
      paint($("queries"), `<div class="muted" style="font-size:12.5px">The agent's searches show up here. Click one to see the ranked results.</div>`);
      return;
    }
    paint($("queries"), searches.slice(0, 15).map((search) => (
      `<button type="button" data-search="${search.token}" class="${search.token === view.search ? "picked" : ""}">` +
      `<span class="ellipsis" title="${esc(search.query)}">${esc(search.query)}<small>${search.is_active ? "live · " : ""}${search.num_users_responded} users${search.username ? ` · ${esc(search.username)}` : ""}</small></span>` +
      `<span class="n">${search.num_files} files</span></button>`
    )).join(""));
  }

  async function renderDrawer() {
    const drawer = $("drawer");
    $("scrim").hidden = view.search === null;
    if (view.search === null) { drawer.hidden = true; return; }
    drawer.hidden = false;
    let data;
    try {
      data = await api(`/api/search/${view.search}?group=${view.group}&limit=25`);
    } catch (error) {
      drawer.innerHTML = `<div class="drawer-head"><h2>Search</h2><span class="spacer"></span><button class="btn sm" type="button" data-do="close-drawer">Close</button></div><p class="muted">${esc(error.message)}</p>`;
      return;
    }
    const isAlbum = view.group === "album";
    const items = isAlbum ? data.albums : data.tracks;
    const stop = data.search.is_active ? `<button class="btn sm" type="button" data-do="stop-search">Stop collecting results</button>` : "";
    const rows = items.map((item) => `<tr>
      <td class="n"><span class="badge">${item.score}</span></td>
      <td class="name"><strong class="ellipsis" title="${esc(item.virtual_path || item.folder_path)}">${esc(isAlbum ? item.folder_name : item.basename)}</strong>
        <small class="ellipsis" title="${esc(item.folder_path)}">${esc(isAlbum ? `${item.num_audio_files} audio files · ${item.formats.join(", ")}` : item.folder_path)}</small></td>
      <td>${esc(item.username)}${item.country_code ? ` <span class="muted">${esc(item.country_code)}</span>` : ""}</td>
      <td class="word">${esc(isAlbum ? "" : item.quality)}</td>
      <td class="n">${esc(item.total_size || item.size)}</td>
      <td>${item.has_free_slot ? `<span class="badge ok">free slot</span>` : `<span class="badge warn">${item.queue_length} queued</span>`}</td>
      <td class="n">${item.measured_speed ? esc(item.measured_speed) : `<span class="faint">${item.upload_speed ? `claims ${esc(item.upload_speed)}` : "—"}</span>`}</td></tr>`).join("");
    drawer.innerHTML = `<div class="drawer-head"><h2>${esc(data.search.query)}</h2>
        <span class="muted">${data.search.num_users_responded} users · ${data.search.num_files} files${data.search.is_active ? " · still collecting" : ""}</span>
        <div class="chips"><button type="button" data-group="album" aria-pressed="${isAlbum}">Albums</button><button type="button" data-group="track" aria-pressed="${!isAlbum}">Tracks</button></div>
        <span class="spacer"></span>${stop}<button class="btn sm" type="button" data-do="close-drawer">Close</button></div>` +
      (rows ? `<table><thead><tr><th class="n">Score</th><th>${isAlbum ? "Folder" : "File"}</th><th>Uploader</th><th>${isAlbum ? "" : "Quality"}</th><th class="n">Size</th><th>Slot</th><th class="n">Real speed</th></tr></thead><tbody>${rows}</tbody></table>`
            : `<p class="muted">No matching results yet.</p>`);
  }

  function renderLog(lines) {
    const log = $("logbox");
    const isAtEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 24;
    const html = lines.map((line) => {
      const cls = /finished|started/i.test(line) && /download/i.test(line) ? "lg-dl" : /cannot|fail|error|denied|rejected|elsewhere/i.test(line) ? "lg-bad" : "";
      return `<span class="${cls}">${esc(line)}</span>`;
    }).join("\n");
    if (paint(log, html) && isAtEnd) log.scrollTop = log.scrollHeight;
  }

  function render(data) {
    view.data = data;
    if (data.server_time) view.skew = Date.now() / 1000 - data.server_time;
    renderTop(data);
    renderOverview(data);
    renderHauls(data.downloads);
    renderCrates(data.jobs || []);
    renderBoard(data);
    renderQueries(data.searches);
    renderLog(data.recent_log || []);
    paint($("foot"), `<span>nicotine-mcp · Nicotine+ ${esc(data.status.version)}</span><span class="ellipsis" title="${esc(data.status.download_folder)}">downloads: ${esc(data.status.download_folder)}</span>`);
  }

  async function refresh() {
    if (view.held) return;
    try {
      render(await api("/api/state"));
      $("live").className = "live";
      $("live").lastElementChild.textContent = "live";
    } catch (error) {
      $("live").className = "live bad";
      $("live").lastElementChild.textContent = `update failed: ${error.message}`;
    }
  }

  async function actOnFiles(files, action) {
    for (const file of files) {
      if (action === "retry") {
        if (file.state === "paused" || file.state === "failed") await api("/api/downloads/retry", {username: file.username, virtual_path: file.virtual_path});
      } else if (action === "remove") {
        await api("/api/downloads/cancel", {username: file.username, virtual_path: file.virtual_path, remove: true});
      } else if (file.state === "active" || file.state === "queued") {
        await api("/api/downloads/cancel", {username: file.username, virtual_path: file.virtual_path, remove: false});
      }
    }
  }

  function closeMenus(except) {
    document.querySelectorAll("details.menu[open]").forEach((menu) => { if (menu !== except) menu.open = false; });
  }

  document.addEventListener("click", async (event) => {
    const menu = event.target.closest("details.menu");
    closeMenus(menu);
    const el = event.target.closest("button, [data-haul-open]");
    if (!el) return;
    const data = el.dataset;
    try {
      if (data.filter) { view.filter = data.filter; if (view.data) renderHauls(view.data.downloads); return; }
      if (data.group) { view.group = data.group; await renderDrawer(); return; }
      if (data.jobFilter) {
        if (view.openJob !== data.job) { view.openJob = data.job; view.jobData = null; view.pickedTitle = null; }
        view.jobFilter = data.jobFilter;
        if (view.data) renderCrates(view.data.jobs || []);
        renderOpenCrate();
        await loadOpenCrate();
        return;
      }
      if (data.do === "export") {
        const result = await api("/api/export", {});
        toast(`Saved ${result.num_jobs} jobs and ${result.num_transfers} downloads to ${result.path}. The other user runs: nicotine-mcp import "${result.path}"`, "ok");
        if (result.warning) toast(result.warning, "bad");
        return;
      }
      if (data.jobDo) {
        if (data.jobDo === "cancel" && !confirm("Cancel this job and remove its unfinished downloads? Finished files stay.")) return;
        if (data.jobDo === "remove" && !confirm("Remove this from the list? Its files stay on disk.")) return;
        if (data.jobDo === "skip-release" && !confirm("Skip this release? Its unfinished downloads are removed.")) return;
        if (data.jobDo === "remove" && view.openJob === data.job) { view.openJob = null; view.jobData = null; }
        await api(`/api/jobs/${data.jobDo}`, {job_id: data.job, flac_only: data.flac === "1", now: data.now === "1", release_id: data.release});
        await refresh();
        await loadOpenCrate();
        return;
      }
      if (data.jobOpen !== undefined) {
        view.openJob = view.openJob === data.jobOpen ? null : data.jobOpen;
        view.jobFilter = "all";
        view.jobData = null;
        view.pickedTitle = null;
        if (view.data) renderCrates(view.data.jobs || []);
        renderOpenCrate();
        await loadOpenCrate();
        if (view.openJob) document.getElementById(`job-${view.openJob}`)?.scrollIntoView({block: "start", behavior: "smooth"});
        return;
      }
      if (data.fileDo) {
        const file = view.data.downloads.find((item) => item.username === data.user && item.virtual_path === data.path);
        if (file) await actOnFiles([file], data.fileDo);
        await refresh();
        return;
      }
      if (data.haulDo) {
        const haul = buildHauls(view.data.downloads).find((item) => item.key === data.haul);
        if (!haul) return;
        if (data.haulDo === "remove" && !confirm(`Remove ${plural(haul.files.length, "download")} from the list? Finished files stay on disk.`)) return;
        await actOnFiles(haul.files, data.haulDo);
        await refresh();
        return;
      }
      if (data.haulOpen !== undefined) {
        if (view.openHauls.has(data.haulOpen)) view.openHauls.delete(data.haulOpen); else view.openHauls.add(data.haulOpen);
        renderHauls(view.data.downloads);
        return;
      }
      if (data.search) { view.search = Number(data.search); view.group = "album"; await renderDrawer(); renderQueries(view.data.searches); return; }
      if (data.do === "close-drawer") { view.search = null; await renderDrawer(); renderQueries(view.data.searches); return; }
      if (data.do === "stop-search") { await api("/api/searches/stop", {token: view.search}); await renderDrawer(); await refresh(); return; }
      if (data.do === "clear-finished") { const r = await api("/api/downloads/clear-finished", {}); toast(`Cleared ${plural(r.num_removed, "finished download")}`); await refresh(); return; }
      if (data.do === "retry-failed") { const r = await api("/api/downloads/retry-failed", {}); toast(`Retrying ${plural(r.num_retried, "download")}`); await refresh(); return; }
      if (data.do === "pause-all") {
        const r = await api("/api/downloads/pause-all", {});
        toast(`Paused ${plural(r.num_paused, "transfer")} and ${plural(r.num_jobs_paused, "job")}`);
        await refresh(); await loadOpenCrate(); return;
      }
      if (data.do === "resume-all") {
        const r = await api("/api/downloads/resume-all", {});
        toast(`Resumed ${plural(r.num_resumed, "transfer")} and ${plural(r.num_jobs_resumed, "job")}`, "ok");
        await refresh(); await loadOpenCrate(); return;
      }
      if (data.do === "copy-log") { await navigator.clipboard.writeText($("logbox").textContent); toast("Log copied"); return; }
    } catch (error) {
      toast(`That didn't work: ${error.message}`, "bad");
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { closeMenus(); if (view.search !== null) { view.search = null; renderDrawer(); } }
  });
  $("scrim").addEventListener("click", () => { view.search = null; renderDrawer(); });

  $("hold").addEventListener("click", () => {
    view.held = !view.held;
    $("hold").textContent = view.held ? "Resume updates" : "Hold";
    $("live").className = view.held ? "live held" : "live";
    $("live").lastElementChild.textContent = view.held ? "held" : "live";
    if (!view.held) refresh();
  });

  if (location.hash.startsWith("#job-")) { view.openJob = decodeURIComponent(location.hash.slice(5)); }
  refresh().then(loadOpenCrate).then(() => {
    if (view.openJob) document.getElementById(`job-${view.openJob}`)?.scrollIntoView({block: "start"});
  });
  setInterval(refresh, 2000);
  setInterval(() => { if (!view.held) loadOpenCrate(); }, 5000);
  setInterval(() => { if (view.search !== null && !view.held) renderDrawer(); }, 10000);
})();
</script>
</body>
</html>
